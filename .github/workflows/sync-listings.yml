# Replicates listings directly from the Centris Data Distribution API
# (RESO Web API) and rebuilds the site when anything changed.
#
# Incremental pulls run every 15 minutes using per-resource
# ModificationTimestamp cursors — measured 2026-08-14: a Broker Loading edit
# is visible on the API within ~1 minute, so polling interval is the only
# latency we control. An incremental costs ~4-6 requests against a 200/min
# ceiling, so this is well within budget.
#
# A full reconciliation runs at most once a day inside the same script — that
# is the only thing that detects REMOVALS (listings sold, expired or
# withdrawn), which Centris flags as essential.
name: Sync listings
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Ignore cursors and re-pull everything'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-listings
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Replicate from Centris
        env:
          CENTRIS_API_KEY: ${{ secrets.CENTRIS_API_KEY }}
        run: node scripts/centris/replicate.mjs ${{ inputs.full && '--full' || '' }}

      - name: Map to site content
        run: node scripts/centris/map-listings.mjs

      - name: Refresh Bank of Canada mortgage rate
        # Non-fatal: a Valet API blip must not block the listing sync.
        continue-on-error: true
        run: node scripts/fetch-rates.mjs

      - name: Validate content builds
        run: |
          npm ci
          npm run content

      - name: Commit & push if changed
        run: |
          if git diff --quiet content/; then
            echo "No content changes."
          else
            git config user.name "listings-sync[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add content/
            git commit -m "sync: refresh listings from Centris"
            git push
          fi
