# Interim Centris datafeed: hourly scrape of luxurymtl.com (the firm's own
# current site, which already syncs with Centris). If listings changed, the
# refreshed content/listings.json is committed, which triggers the Amplify
# build → the new site updates within ~1 hour of a listing change.
name: Sync listings
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-listings
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scrape listings
        run: node scripts/sync-from-luxurymtl.mjs
      - name: Refresh Bank of Canada mortgage rate
        # Non-fatal: a Valet API blip must not block the listing sync.
        continue-on-error: true
        run: node scripts/fetch-rates.mjs
      - name: Validate content still builds
        run: |
          npm ci
          npm run content
      - name: Staleness guard
        # The upstream Centris importer runs on infrastructure we do not
        # control (see docs/legacy-inventory.md). If it dies, the legacy site
        # freezes and this scraper would keep "succeeding" on stale data.
        # Fail loudly if the listing set has not changed in STALE_DAYS.
        env:
          STALE_DAYS: 10
        run: |
          last=$(git log -1 --format=%ct -- content/listings.json)
          age=$(( ( $(date +%s) - last ) / 86400 ))
          echo "content/listings.json last changed ${age} day(s) ago"
          if [ "$age" -gt "$STALE_DAYS" ]; then
            echo "::error::Legacy listings unchanged for ${age} days (> ${STALE_DAYS})."
            echo "::error::The upstream Centris importer may have stopped. Verify luxurymtl.com before trusting this site's data."
            exit 1
          fi

      - name: Commit & push if changed
        run: |
          if git diff --quiet content/listings.json content/rates.json; then
            echo "No listing or rate changes."
          else
            git config user.name "listings-sync[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add content/listings.json content/rates.json
            git commit -m "sync: refresh listings and rates"
            git push
          fi

# (touched to trigger GitHub workflow discovery)
